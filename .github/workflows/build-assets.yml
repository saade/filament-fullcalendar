name: build-assets

on:
  push:
    branches:
      - 5.x
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'resources/js/**'
      - '.github/workflows/build-assets.yml'
  pull_request:
    branches:
      - 5.x
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'resources/js/**'
      - '.github/workflows/build-assets.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request only has to build. Its `resources/dist` is not looked at:
  # the assets are rebuilt from the sources once it is merged.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    name: The assets build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    name: Rebuild the assets

    permissions:
      contents: write

    steps:
      # persist-credentials: true is required so `git-auto-commit-action` below
      # can push the rebuilt assets back to the branch.
      # zizmor: ignore[artipacked]
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit the rebuilt assets
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: 'build: rebuild the assets'
          file_pattern: resources/dist
